  headline_finding: '39 of 40 sampled true-positive events were censored: detection
    confidence never dropped below 0.5 within the available pre-trigger buffer (up
    to several hundred ms tested). This means the report cannot cite a specific bounded
    lead time from this measurement -- the honest statement is ''detectable at least
    ~477ms before the interlock trip for most sampled events, true extent not established'',
    not a precise duration like the report''s fabricated ''50-500ms''. This also raises
    a further question worth flagging rather than resolving here: confidence this
    stable across hundreds of ms may indicate the model is partly keying on a stable
    per-capture characteristic rather than a fault-onset-proximate signal specifically
    -- see PHASE3_WEAKNESS_DIAGNOSIS_AND_OPERATIONAL_USABILITY.md section 2.3 for
    the related acquisition-convention caveat found earlier.'
  caveat: This measures how far before the INFORMATIC trigger (zero_idx) the signal
    remains distinguishable to this model, not how far before the TRUE PHYSICAL onset
    -- zero_idx itself can lag true onset (see the AMPT-refinement work in prepare_data_cluster_v6.py,
    applied to one of the seven fault categories). Report this as "detectable ahead
    of the interlock trip," not "before any physical change."
