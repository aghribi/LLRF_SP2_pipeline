meta:
  n_per_class_sampled: 40
  method: Re-read raw postmortem files directly (bypassing the cached feature pkl),
    re-ran zero_idx = argmin(abs(time_arr)) exactly as prepare_data_cluster_v6.py,
    and computed pre-trigger fraction = zero_idx / total_samples per file.
  conclusion: Normal events have a substantially larger pre-trigger fraction than
    Fault events (gap ~0.21-0.25), confirmed via two independent raw-file samples.
    This is real and affects engineer_features()'s "steady-state" pre/post features
    (detuning, RF-mismatch, modulator, RF-power), which deliberately use ALL available
    pre-trigger data with no fixed bound.
  corrected_conclusion: 'This window-length gap does NOT explain step 05''s near-perfect
    supervised AUC, however: restricting to ONLY the codebase''s already-correctly-bounded
    "true precursor" features (engineer_features() section 4 trend/CUSUM/early-late-window
    + section 6 segment-based, 382 of 766 columns, all built on a FIXED scale_samples(3000,
    dt_us) window with a `continue`-if-too-short guard against variable window length)
    still gives supervised RF AUC=0.9998+/-0.0002 across 10 repeated splits, while
    Isolation Forest/LOF on the SAME 382 columns still only reach 0.65/0.59 -- identical
    to their score on the full 766-column set. Window length cannot explain a result
    on features where window length is already fixed. The strong-supervised/weak-unsupervised
    gap is the ordinary signature of a real, learnable decision boundary, not an artifact.
    The remaining caveat is interpretive: this fixed window sits immediately before
    zero_idx (the informatic ALM trigger), which this codebase''s own AMPT-refinement
    work already establishes can lag the true physical fault onset for at least one
    category -- so this likely reflects detecting the fault already ramping up ahead
    of the interlock trip, not an independent precursor from before any physical change
    begins. Recommendation: step 05/05a should be restricted to this 382-column "true
    precursor" subset (excluding whole-signal and unbounded steady-state features,
    which ARE inappropriate for this task) and the result reported as early detection
    of fault onset ahead of the interlock, not as prediction before any physical change
    -- a real, valuable, but differently-scoped claim than "precursor detection" currently
    implies.'
