meta:
  grouping_method: Exact-name / prefix / suffix classification by the actual engineer_features()
    code section that produced each feature (effective decay, detuning, microphonics,
    RF mismatch, modulator command, phase stability, RF power flow -- the seven families
    in Appendix A -- plus Statistical, Temporal, Metadata/Status, Other), verified
    100% coverage with no 'Other' fallback against the real 770-feature V6 set. Replaces
    a first-match substring heuristic that misclassified known features (see get_physics_group()
    in prepare_10_enhanced_shap_analysis.py).
  primary_metric_is_per_feature_mean: The seven physics-informed families total only
    39 features combined, versus 262 Statistical and 466 Temporal -- a group-SUM comparison
    structurally favors the larger groups regardless of per-feature informativeness,
    so the per-feature MEAN (dividing out this count imbalance) is the metric this
    manifest treats as primary; the sum-based table is exposed alongside it for direct
    comparison, not hidden.
