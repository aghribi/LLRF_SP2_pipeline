name: llrf_anomaly_detection
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10

  # Data manipulation
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10

  # Machine Learning
  - scikit-learn>=1.3
  - xgboost>=2.0
  - lightgbm>=4.0
  - imbalanced-learn>=0.11

  # Deep Learning (optional, for advanced models)
  - tensorflow>=2.13
  - pytorch>=2.0
  - pytorch-cuda=11.8  # If GPU available

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.17
  - bokeh>=3.2

  # Jupyter
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipykernel>=6.25
  - ipywidgets>=8.1

  # Progress bars
  - tqdm>=4.66

  # Time-series analysis
  - statsmodels>=0.14

  # Clustering
  - hdbscan>=0.8

  # Data formats
  - h5py>=3.9
  - pyarrow>=13.0

  # Utilities
  - pyyaml>=6.0
  - python-dotenv>=1.0

  # Code quality
  - black>=23.0
  - flake8>=6.0
  - pytest>=7.4

  # Pip packages (not available in conda)
  - pip>=23.0
  - pip:
    # Explainability
    - shap>=0.43
    - lime>=0.2.0.1
    - dice-ml>=0.10
    - alibi>=0.9.4

    # Time-series specific
    - tsfresh>=0.20.1
    - stumpy>=1.12.0
    - dtaidistance>=2.3.10
    - sktime>=0.24.0
    - tslearn>=0.6.2

    # Causal inference
    - causalnex>=0.12.0
    - dowhy>=0.10

    # Uncertainty quantification
    - nonconformist>=2.1.0

    # Dashboards
    - streamlit>=1.28
    - dash>=2.14

    # Feature selection
    - mlxtend>=0.23.0

    # Symbolic regression (optional)
    # - pysr>=0.16.0  # Requires Julia, uncomment if needed

    # Model interpretation
    - interpret>=0.4.3

    # Active learning
    - modAL>=0.4.1

    # Report generation
    - fpdf2>=2.7.6
    - jinja2>=3.1.2

    # Additional utilities
    - joblib>=1.3.2
